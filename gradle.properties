org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=37

# 签名信息不写在这里（本文件会提交到仓库）。
# 请放到 ~/.gradle/gradle.properties，或用 -P 传给 gradle：
#   RELEASE_STORE_FILE=/绝对路径/release.jks
#   RELEASE_STORE_PASSWORD=你的store密码
#   RELEASE_KEY_ALIAS=release
#   RELEASE_KEY_PASSWORD=你的key密码
# 读不到这些属性时构建会自动回退到 debug 签名，clone 下来即可直接编译。
#
# 在 ARM 设备上本地构建（用 qemu 跑 aapt2）时可临时加一行，指向你的 aapt2：
# android.aapt2FromMavenOverride=/path/to/aapt2
